<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <title>Tab Screenshot</title>
  </head>
  <body>
    <main>
      <header class="popup-header">
        <div class="header-title-wrap">
          <img src="icons/icon-32.png" width="20" height="20" alt="" class="header-icon">
          <h1>Tab Screenshot</h1>
        </div>
      </header>

      <p class="subtitle">Choose what to capture from this tab.</p>

      <div class="card-section" id="save-options">
        <div class="field-group">
          <label for="destination">Save to</label>
          <div class="select-wrapper">
            <select id="destination" name="destination">
              <option value="file">File (download)</option>
              <option value="clipboard">Clipboard</option>
            </select>
            <svg class="select-arrow" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>

        <div class="field-group" id="format-wrap">
          <label for="format">Image format</label>
          <div class="select-wrapper">
            <select id="format" name="format">
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
              <option value="webp">WebP</option>
            </select>
            <svg class="select-arrow" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
      </div>

      <div class="card-section">
        <label class="toggle" id="annotate-wrap">
          <span class="toggle-label">Annotate after capture</span>
          <div class="switch">
            <input type="checkbox" id="annotate">
            <span class="slider"></span>
          </div>
        </label>
      </div>

      <div class="action-buttons">
        <button id="visible" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
          <span>Capture visible area</span>
        </button>

        <button id="portion" type="button" class="secondary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3 3">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
          </svg>
          <span>Capture selected area</span>
        </button>
      </div>

      <p id="status" class="status" role="status" hidden></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
